# OSS Scanner 이미지 검증 — Anthropic OSS Scanner 가 하는 것과 같은 순서로 우리 이미지를 세운다.
#
# 왜 러너인가: 스캐너는 저장소를 받아 `.oss-scanner/Dockerfile` 로 이미지를 짓고(인터넷 있음), 그 뒤
#   **인터넷 없이** 감사한다. 그 이미지가 서는지·시험이 망 없이 도는지를 등록 전에 재야 하는데, 개발 맥에는
#   Docker 가 없다. 그래서 무료 우분투 러너에서 같은 두 단계를 돈다.
# 무엇을 재나:
#   ① `docker build -f .oss-scanner/Dockerfile .` 가 선다(빌드 시간을 요약에 남긴다 · 스캐너 상한 45분).
#   ② 지은 이미지를 `--network none` 으로 띄워 `.oss-scanner/run-tests.sh` 가 통과한다.
# ⚠못 재는 것(정직): 스캐너가 이미지 위에 얹는 도구 층(Claude Code·디버거 설치)과 스캐너 가상기계 크기
#   (16 CPU · 64GB)는 재현하지 않는다 — 러너는 더 작다(빌드 시간은 상한 쪽으로 기운다).
name: OSS Scanner 이미지 검증

on:
  workflow_dispatch:
    inputs:
      scanner_ref:
        description: 'scanner-check 잡이 받을 가지 — <이 저장소 주인>/oss-scanner 의 등록 가지(project.yaml 이 든 것)'
        required: false
        default: 'enrol-jarvis-install'
  push:
    branches: ['**']   # 태그 push 에는 돌지 않는다(경로 필터는 태그 push 에서 평가되지 않는다)
    paths:
      - '.oss-scanner/**'
      - '.github/workflows/oss-scanner-image.yml'

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # 스캐너는 전체 이력으로 클론한다 — 같은 조건으로 받는다(run-tests.sh 가 git ls-files 를 쓴다).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 디스크 여유 (진단 · 판정 아님)
        run: df -h / | tail -1

      - name: ① docker build (스캐너와 같은 문맥 = 저장소 루트)
        run: |
          set -euo pipefail
          start=$(date +%s)
          docker build --progress=plain -f .oss-scanner/Dockerfile -t oss-scanner-check:jarvis-install .
          secs=$(( $(date +%s) - start ))
          echo "docker build: ${secs}s (스캐너 상한 2700s)" | tee -a "$GITHUB_STEP_SUMMARY"
          docker image ls oss-scanner-check:jarvis-install --format 'image size: {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 빌드 중 시험 로그 (이미지 안 /var/log/oss-scanner-tests.log)
        run: docker run --rm --network none oss-scanner-check:jarvis-install tail -40 /var/log/oss-scanner-tests.log

      - name: ② 망 없이 시험 (--network none)
        run: |
          # 기본 셸 = bash -eo pipefail — 붉어도 요약을 먼저 남기려고 rc 를 받아 둔다(pipefail 이라 rc = docker 쪽)
          start=$(date +%s)
          rc=0
          docker run --rm --network none --user tester oss-scanner-check:jarvis-install bash .oss-scanner/run-tests.sh 2>&1 | tee /tmp/oss-offline.log || rc=$?
          echo "offline tests: rc=${rc} · $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
          sed -n '/== \[oss-scanner\] 요약 ==/,$p' /tmp/oss-offline.log >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  # 등록 PR 체크리스트의 「`tools/check <name>` builds the project, and its tests run in the shell that follows」 칸을
  # 사실로 만드는 잡 — **손으로 돌릴 때만**(workflow_dispatch) 돈다. 위 image 잡과 다른 점: 스캐너 저장소의 도구가
  # 공개 저장소를 **익명 클론해** 짓고, 그 위에 스캐너 도구 층(Claude Code 설치 포함)을 얹은 뒤, 망 없는 셸에
  # 표준입력으로 받은 명령을 실행한다(= 등록 뒤 스캐너가 밟는 순서 그대로 · 가상기계 크기만 다르다).
  # project.yaml 은 여기에 두지 않는다 — 등록 PR 로 낼 가지(저장소 주인의 oss-scanner 포크)를 그대로 받아 쓴다.
  #   그래서 순서 = 포크에 등록 가지 push → 이 잡을 손으로 실행 → 초록이면 PR 본문의 그 칸을 체크하고 PR 을 연다.
  # ⚠ tools/check 는 셸의 종료값을 버린다(빌드가 서면 0) — 시험 결과는 OSS_TESTS_RC 줄로 따로 받는다.
  scanner-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SCANNER_REPO: ${{ github.repository_owner }}/oss-scanner
      SCANNER_REF: ${{ inputs.scanner_ref }}
    steps:
      - name: 등록 가지 받기 (포크 · 익명)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$SCANNER_REF" "https://github.com/${SCANNER_REPO}" scanner
          git -C scanner log -1 --format="${SCANNER_REPO}@${SCANNER_REF} = %h %ci" | tee -a "$GITHUB_STEP_SUMMARY"
          test -f scanner/projects/jarvis-install/project.yaml
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
          python3 scanner/tools/validate.py | grep -F 'jarvis-install'

      - name: tools/check jarvis-install (짓기 → 도구 층 → 망 없는 셸에서 시험)
        run: |
          cd scanner
          start=$(date +%s)
          rc=0
          printf '%s\n' 'runuser -u tester -- bash .oss-scanner/run-tests.sh; echo "OSS_TESTS_RC=$?"' \
            | python3 tools/check jarvis-install 2>&1 | tee /tmp/oss-check.log || rc=$?
          tests=$(sed -n 's/^OSS_TESTS_RC=\([0-9][0-9]*\).*/\1/p' /tmp/oss-check.log | tail -1)
          echo "tools/check: rc=${rc} · tests rc=${tests:-시험이 돌지 않음} · $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
          sed -n '/== \[oss-scanner\] 요약 ==/,/^OSS_TESTS_RC=/p' /tmp/oss-check.log >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" -eq 0 ] || exit "$rc"
          [ -n "$tests" ] || exit 3
          exit "$tests"
